[project]
name = "vl-patch-manipulator"
version = "0.1.0"
description = "Loss-preserving structural tools for vvvv gamma .vl patch files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.3,<7",
]

[project.scripts]
vlpatch = "vl_patch_manipulator.cli:main"
vlpatch-server = "vl_patch_manipulator.server:main"

[project.optional-dependencies]
server = [
    "mcp>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vl_patch_manipulator"]

[dependency-groups]
test = [
    "pytest>=8.3,<9",
]
